{% extends "base.html" %}
{% block title %}Verify Email | Recruitment Portal{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">Verify Email</h1>
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" name="email" type="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="code" class="form-label">Verification Code</label>
                        <input id="code" name="code" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Verify Email</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
